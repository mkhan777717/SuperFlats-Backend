services:
  db:
    container_name: superflats-db
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      # Use 'root' user and the application's password for the healthcheck ping.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      retries: 10
      timeout: 5s
      start_period: 10s

  api:
    container_name: superflats-api
    build: .
    ports:
      - "5001:5001"
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
    # Explicitly wait 5 seconds before running the app's main process.
    # This mitigates the race condition where the Node app tries to connect before
    # the MySQL server is fully listening on its socket, even after the healthcheck passes.
    command: ["sh", "-c", "echo 'Waiting 5 seconds for DB listener to fully initialize...' && sleep 5 && npm start"]
    # NOTE: If your actual entrypoint is different from 'npm start', replace it above (e.g., 'node index.js').

volumes:
  mysql_data:
