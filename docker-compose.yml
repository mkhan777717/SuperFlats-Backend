services:
  db:
    container_name: superflats-db
    image: mysql:8.0
    restart: always
    environment:
      # FIX: Use the password the application expects (${DB_PASSWORD} = super123) 
      # as the MYSQL_ROOT_PASSWORD to ensure consistency.
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      
      # We no longer need MYSQL_USER or MYSQL_PASSWORD since the app connects as root.
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      # FIX: Use 'root' user and the application's password for the healthcheck ping.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      retries: 10
      timeout: 5s
      start_period: 10s

  api:
    container_name: superflats-api
    build: .
    ports:
      - "5001:5001"
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db

volumes:
  mysql_data:
