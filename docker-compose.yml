services:
  db:
    container_name: superflats-db
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - ./super_flats_new.sql:/docker-entrypoint-initdb.d/super_flats_new.sql
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s # Check every 5 seconds
      retries: 15 # Allow up to 15 retries (75 seconds of total checking time)
      timeout: 5s
      # Give the DB 30 seconds to start and import data before checking
      start_period: 30s 

  api:
    container_name: superflats-api
    build: .
    ports:
      - "5001:5001"
    restart: always
    depends_on:
      db:
        condition: service_healthy # Wait for the robust healthcheck to pass
    env_file:
      - .env
    environment:
      DB_HOST: db
    command: >
      sh -c "
      npx sequelize-cli db:migrate &&
      npm start
      "

    logging:
      options:
        max-size: "10m" 
        max-file: "5"   

volumes:
  mysql_data:
