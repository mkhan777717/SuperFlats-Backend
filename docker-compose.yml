services:
  db:
    container_name: superflats-db
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: super_flats_new
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  api:
    container_name: superflats-api
    build: .
    ports:
      - "5001:5001"       
    restart: always
    depends_on:
      - db
    env_file:
      - .env           
    environment:
      DB_HOST: db         

volumes:
  mysql_data:
