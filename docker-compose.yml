version: "3.8"

services:
  db:
    container_name: superflats-db
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_PASSWORD}",
        ]
      interval: 5s
      retries: 15
      timeout: 5s
      start_period: 30s

  api:
    container_name: superflats-api
    build: .
    ports:
      - "5001:5001" # Exposes port 5001 so the host Nginx configuration can talk to it
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
    command: >
      sh -c "
      npx sequelize-cli db:migrate &&
      npm start
      "
    logging:
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  mysql_data:
